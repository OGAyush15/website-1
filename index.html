
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIESEC Marketing Department</title>

    <style>
        .poster {
            position: relative;
            width: 100%;
            max-width: 1080px;
            margin: auto;
        }

        .poster img {
            display: block;
            width: 100%;
            height: auto;
        }

        /* Clickable area on the first image only */
        .link-button {
            position: absolute;
            left: 68.5%;
            top: 78.5%;
            width: 17%;
            height: 15%;
            cursor: pointer;
        }

        
.instagram-poster {
    position: relative;
}

.instagram-link {
    position: absolute;
    left: 46.5%;
    top: 65%;
    width: 7%;
    height: 12%;
    cursor: pointer;
}

    </style>
</head>
<body>

    <!-- First image with clickable link -->
    <div class="poster">
        <img src="img/1.jpg" alt="AIESEC Poster">

        <a class="link-button"
           href="https://aiesec.in"
           target="_blank"
           rel="noopener noreferrer"
           aria-label="Open link">
        </a>
    </div>

    <!-- Three additional images without links -->
    <div class="poster">
        <img src="img/2.jpg" alt="Image 2">
    </div>

    <div class="poster">
        <img src="img/3.jpg" alt="Image 3">
    </div>

    <div class="poster">
        <img src="img/4.jpg" alt="Image 4">
    </div>

    <div class="poster instagram-poster">
    <img src="img/5.jpg" alt="You can also visit Instagram">

    <a class="instagram-link"
       href="https://www.instagram.com/aiesecinbhopal/reels/"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="Visit Instagram">
    </a>
</div>

</body>
</html>
